<style>
:root{--cream:#f3f3ee;--ink:#1c2330;--blue:#3b63d8;--cyan:#22c5df;--amber:#e9a31a;--grey:#4b515c;--mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;--sans:Inter,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#17191e;overflow:hidden;font-family:var(--sans)}
.deck{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.slide{height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--cream);overflow:hidden;container-type:inline-size}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;pointer-events:none}
.ov .c{pointer-events:auto;position:absolute;font:1.05cqw var(--mono);color:var(--ink)}
.ov input[type=range]{width:100%;accent-color:#3b63d8}
text{font-family:var(--sans);fill:var(--ink)}
.m{font-family:var(--mono)}
.b{font-weight:700}
.a,.fade{opacity:0}
.slide.on .a{animation:rise .9s cubic-bezier(.2,.7,.2,1) var(--d,0s) forwards}
.slide.on .fade{animation:fade .8s ease var(--d,0s) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.dr{stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .dr{animation:dr 1.3s ease var(--d,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.slide.on .grow{animation:grow 1s ease var(--d,0s) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pop{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.3)}
.slide.on .pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) var(--d,0s) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.mv{stroke-dasharray:16 14;animation:mv 1s linear infinite}
.mvA{stroke-dasharray:24 14;animation:mv 1.4s linear infinite}
@keyframes mv{to{stroke-dashoffset:-30}}
.glow{animation:glow 3s ease-in-out infinite var(--d,0s)}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.hl{animation:hl 4s ease-in-out infinite var(--d,0s)}
@keyframes hl{0%,100%{fill:#f6f6f2}10%,25%{fill:#d6e0fb}40%{fill:#f6f6f2}}
.rip{transform-box:view-box;transform-origin:1420px 384px;animation:rip 6s ease-in-out infinite var(--d,0s)}
@keyframes rip{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 22s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.rock{transform-box:view-box;transform-origin:1160px 482px;animation:rock 4s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.rh{fill:transparent}
.rh:hover{fill:rgba(59,99,216,.08)}
.hot{animation:hot 1s ease-in-out infinite}
@keyframes hot{0%,100%{opacity:1}50%{opacity:.45}}
.node{transition:fill .2s}
.node:hover{fill:#1f3fb0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
nav#dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:9}
nav#dots span{width:9px;height:9px;border-radius:50%;background:#55596a;cursor:pointer;transition:background .2s,transform .2s}
nav#dots span.act{background:var(--cyan);transform:scale(1.3)}
</style>
</head>

(function () {
  const area = document.getElementById('s14area'), mark = document.getElementById('s14mark');
  const X = u => 212 + 171 * u, Y = p => 646 - 406 * p;
  const P = u => 1 / (1 + Math.exp(1.1 * (u - 2.778)));
  let d = '';
  for (let u = -0.19; u <= 4.46; u += 0.02) d += (d ? 'L' : 'M') + X(u).toFixed(1) + ' ' + Y(P(u)).toFixed(1);
  area.innerHTML = `<path d="${d} L975 646 L180 646 Z" fill="url(#gArea)"/><path d="${d}" fill="none" stroke="#22c5df" stroke-width="4"/>`;
  const r = document.getElementById('s14r'), lbl = document.getElementById('s14lbl'), out = document.getElementById('s14out');
  const fmt = m => {
    if (m < 60) return Math.round(m) + ' min';
    const h = m / 60;
    if (h < 48) return (h < 10 ? h.toFixed(1) : Math.round(h)) + ' hours';
    return Math.round(h / 24) + ' days';
  };
  function upd() {
    const u = +r.value / 100 * 4.46, p = P(u), x = X(u), y = Y(p);
    mark.innerHTML = `<line x1="${x}" y1="${y}" x2="${x}" y2="646" stroke="#1c2330" stroke-width="2" stroke-dasharray="3 4"/>

})();

/* ---------- navigation: one slide per screen, animate on entry ---------- */
(function () {
  const deck = document.getElementById('deck');
  const slides = Array.from(document.querySelectorAll('.slide'));
  const dots = document.getElementById('dots');
  slides.forEach((s, i) => {
    const d = document.createElement('span');
    d.title = 'Slide ' + (i + 1);
    d.addEventListener('click', () => s.scrollIntoView({ behavior: 'smooth' }));
    dots.appendChild(d);
  });
  const dotEls = Array.from(dots.children);
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      e.target.classList.toggle('on', e.isIntersecting && e.intersectionRatio > 0.6);
      if (e.isIntersecting && e.intersectionRatio > 0.6) {
        dotEls.forEach((d, i) => d.classList.toggle('act', slides[i] === e.target));
      }
    });
  }, { root: deck, threshold: [0, 0.6, 1] });
  slides.forEach(s => io.observe(s));
  const cur = () => Math.round(deck.scrollTop / window.innerHeight);
  const go = i => slides[Math.max(0, Math.min(slides.length - 1, i))].scrollIntoView({ behavior: 'smooth' });
  document.addEventListener('keydown', e => {
    if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur() + 1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur() - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(slides.length - 1);
  });
})();
